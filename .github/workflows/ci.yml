name: ci

on:
  workflow_dispatch:
    inputs:
      linux:
        description: "Linux: clang tests with sanitizers, coverage, examples"
        type: boolean
        default: true
      macos:
        description: "macOS: tests with sanitizers, coverage, examples"
        type: boolean
        default: true
      windows:
        description: "Windows: MSVC tests and example"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    if: ${{ inputs.linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Configure (ASan + UBSan)
        run: cmake -S misc -B build/asan -DCMAKE_C_COMPILER=clang -DWAV_SANITIZE=ON -DWAV_WERROR=ON
      - name: Build
        run: cmake --build build/asan --target all wav_bench
      - name: Test and examples
        run: ctest --test-dir build/asan --output-on-failure
      - name: Coverage (every branch of the headers)
        run: |
          cmake -S misc -B build/cov -DCMAKE_C_COMPILER=clang -DWAV_COVERAGE=ON -DWAV_WERROR=ON
          cmake --build build/cov --target coverage

  macos:
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure (ASan + UBSan)
        run: cmake -S misc -B build/asan -DWAV_SANITIZE=ON -DWAV_WERROR=ON
      - name: Build
        run: cmake --build build/asan --target all wav_bench
      - name: Test and examples
        run: ctest --test-dir build/asan --output-on-failure
      - name: Coverage (every branch of the headers)
        run: |
          cmake -S misc -B build/cov -DWAV_COVERAGE=ON -DWAV_WERROR=ON
          cmake --build build/cov --target coverage

  windows:
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure (MSVC)
        run: cmake -S misc -B build
      - name: Build
        run: cmake --build build --config Release --target ALL_BUILD wav_bench
      - name: Test and examples
        run: ctest --test-dir build -C Release --output-on-failure
